# See the full configuration reference: https://rioterm.com/docs/config

copy-on-select = true
line-height = 1.0
option-as-alt = "both"
scrollback-history-limit = 50000

[fonts]
family = "0XProto Nerd Font"
size = 14

[window]
blur = "macos-glass-regular"
opacity = 0.9

[bindings]
keys = [
  { key = "return", with = "shift", esc = "\n" }
]
